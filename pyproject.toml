[project]
name = "deepseek-code"
version = "0.1.0"
description = "DeepSeek Code Harness CLI - Claude Code 风格 AI 编码助手"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "DeepSeek", email = "dev@example.com"}
]
dependencies = [
  "rich>=13.0",
  "pydantic>=2.0",
  "openai>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
deepseek-code = "deepseek_code.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["deepseek_code"]

[tool.pytest.ini_options]
pythonpath = ["src"]
