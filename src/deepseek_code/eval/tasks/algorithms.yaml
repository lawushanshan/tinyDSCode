- task_id: "algo_001"
  prompt: |
    def two_sum(nums: list[int], target: int) -> list[int]:
        """
        Given a list of integers, return indices of the two numbers such that
        they add up to target.

        Examples:
        >>> two_sum([2, 7, 11, 15], 9)
        [0, 1]
        """
  test_code: |
    assert sorted(two_sum([2, 7, 11, 15], 9)) == [0, 1]
    assert sorted(two_sum([3, 2, 4], 6)) == [1, 2]
    assert sorted(two_sum([3, 3], 6)) == [0, 1]
  entry_point: "two_sum"
  difficulty: "easy"
  category: "algorithm"
  description: "Two sum problem"

- task_id: "algo_002"
  prompt: |
    def merge_sorted_arrays(arr1: list[int], arr2: list[int]) -> list[int]:
        """
        Merge two sorted arrays into one sorted array.

        Examples:
        >>> merge_sorted_arrays([1, 3, 5], [2, 4, 6])
        [1, 2, 3, 4, 5, 6]
        """
  test_code: |
    assert merge_sorted_arrays([1, 3, 5], [2, 4, 6]) == [1, 2, 3, 4, 5, 6]
    assert merge_sorted_arrays([], [1, 2, 3]) == [1, 2, 3]
    assert merge_sorted_arrays([1, 2, 3], []) == [1, 2, 3]
    assert merge_sorted_arrays([], []) == []
    assert merge_sorted_arrays([1], [2]) == [1, 2]
    assert merge_sorted_arrays([-1, 0, 1], [-2, 2]) == [-2, -1, 0, 1, 2]
  entry_point: "merge_sorted_arrays"
  difficulty: "easy"
  category: "algorithm"
  description: "Merge two sorted arrays"

- task_id: "algo_003"
  prompt: |
    def max_subarray_sum(nums: list[int]) -> int:
        """
        Find the contiguous subarray with the largest sum and return that sum.

        Examples:
        >>> max_subarray_sum([-2, 1, -3, 4, -1, 2, 1, -5, 4])
        6
        >>> max_subarray_sum([5, 4, -1, 7, 8])
        23
        """
  test_code: |
    assert max_subarray_sum([-2, 1, -3, 4, -1, 2, 1, -5, 4]) == 6
    assert max_subarray_sum([5, 4, -1, 7, 8]) == 23
    assert max_subarray_sum([-1]) == -1
    assert max_subarray_sum([1]) == 1
    assert max_subarray_sum([-2, -1, -3]) == -1
  entry_point: "max_subarray_sum"
  difficulty: "medium"
  category: "algorithm"
  description: "Maximum subarray sum (Kadane's algorithm)"
