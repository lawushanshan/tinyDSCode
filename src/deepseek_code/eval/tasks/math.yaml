- task_id: "math_001"
  prompt: |
    def is_prime(n: int) -> bool:
        """
        Check if a positive integer n is prime. Returns False for n < 2.

        Examples:
        >>> is_prime(2)
        True
        >>> is_prime(4)
        False
        >>> is_prime(17)
        True
        """
  test_code: |
    assert is_prime(2) == True
    assert is_prime(3) == True
    assert is_prime(4) == False
    assert is_prime(17) == True
    assert is_prime(1) == False
    assert is_prime(0) == False
    assert is_prime(-5) == False
    assert is_prime(97) == True
    assert is_prime(100) == False
  entry_point: "is_prime"
  difficulty: "easy"
  category: "math"
  description: "Primality test"

- task_id: "math_002"
  prompt: |
    def gcd(a: int, b: int) -> int:
        """
        Compute the greatest common divisor of two non-negative integers
        using Euclid's algorithm.

        Examples:
        >>> gcd(48, 18)
        6
        >>> gcd(7, 13)
        1
        """
  test_code: |
    assert gcd(48, 18) == 6
    assert gcd(7, 13) == 1
    assert gcd(0, 5) == 5
    assert gcd(5, 0) == 5
    assert gcd(0, 0) == 0
    assert gcd(100, 10) == 10
    assert gcd(270, 192) == 6
  entry_point: "gcd"
  difficulty: "easy"
  category: "math"
  description: "Greatest common divisor"
